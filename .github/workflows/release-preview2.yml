name: Publish Android preview 2
on:
  push:
    branches: [feat/android-next-update]
    paths: [.github/workflows/release-preview2.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-android-preview-2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: 1326007879-sys/chatgpt-01
      TAG: v0.1.0-preview.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: test "$GITHUB_REPOSITORY" = "$GH_REPO"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check scripts tools tests
      - working-directory: android
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest -PpetPreviewInstall=true -PpetPython="$(command -v python)" --console=plain
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir publication
          cp android/app/build/outputs/apk/debug/app-debug.apk publication/chatgpt01-petai-0.1.0-preview.2-debug.apk
          cp docs/releases/v0.1.0-preview.2/{INSTALL.md,KNOWN_ISSUES.md} LICENSE THIRD_PARTY_NOTICES.md publication/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs publication/*.apk > publication/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging publication/*.apk > publication/APK-METADATA.txt
          python - <<'PY'
          import os,json,pathlib,hashlib
          p=pathlib.Path('publication'); a=next(p.glob('*.apk'))
          metadata=(p/'APK-METADATA.txt').read_text()
          assert "name='io.github.chatgpt01.petai.preview'" in metadata
          assert "versionCode='2'" in metadata and "versionName='0.1.0-preview.2'" in metadata
          data={'repository':os.environ['GH_REPO'],'commit':os.environ['GITHUB_SHA'],'tag':os.environ['TAG'],'application_id':'io.github.chatgpt01.petai.preview','version_name':'0.1.0-preview.2','version_code':2,'build_parameters':{'petPreviewInstall':True},'apk':a.name,'apk_bytes':a.stat().st_size,'apk_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'signing':'Ephemeral GitHub Actions Debug signing; not production signing','device_acceptance':'Pending; software emulator startup ANR remains unresolved','run_url':f"https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          (p/'SOURCE.json').write_text(json.dumps(data,indent=2)+'\n')
          with (p/'SHA256SUMS.txt').open('w') as out:
              for f in sorted(p.iterdir()):
                  if f.name!='SHA256SUMS.txt': out.write(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n')
          PY
          (cd publication && sha256sum -c SHA256SUMS.txt)
      - name: Create or check draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,json,os
          endpoint=f"repos/{os.environ['GH_REPO']}/releases/tags/{os.environ['TAG']}"
          r=subprocess.run(['gh','api',endpoint],text=True,capture_output=True)
          if r.returncode==0:
              release=json.loads(r.stdout)
              assert release['draft'] and release['prerelease'], 'Refuse to modify published release'
              assert release['target_commitish']==os.environ['GITHUB_SHA'], 'Unexpected source commit'
              assert not release['assets'], 'Refuse to overwrite existing assets'
          elif 'HTTP 404' in r.stderr:
              subprocess.run(['gh','release','create',os.environ['TAG'],'--repo',os.environ['GH_REPO'],'--target',os.environ['GITHUB_SHA'],'--draft','--prerelease','--title','AI 桌宠 v0.1.0-preview.2（六模块验收版）','--notes-file','docs/releases/v0.1.0-preview.2/RELEASE_NOTES.md'],check=True)
          else:
              raise SystemExit(r.stderr)
          PY
      - name: Upload, verify and publish preview
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" publication/* --repo "$GH_REPO"
          gh api "repos/$GH_REPO/releases/tags/$TAG" > uploaded.json
          python - <<'PY'
          import json,pathlib,hashlib,os
          r=json.load(open('uploaded.json'))
          assert r['draft'] and r['prerelease'] and r['target_commitish']==os.environ['GITHUB_SHA']
          assets={a['name']:a for a in r['assets']}
          expected={f.name for f in pathlib.Path('publication').iterdir()}
          assert set(assets)==expected
          for f in pathlib.Path('publication').iterdir():
              a=assets[f.name]
              assert a['state']=='uploaded' and a['size']==f.stat().st_size
              assert a.get('digest')=='sha256:'+hashlib.sha256(f.read_bytes()).hexdigest()
          PY
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --latest=false
